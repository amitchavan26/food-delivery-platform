spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fooddelivery}
    username: ${DB_USER:fooddelivery}
    password: ${DB_PASSWORD:fooddelivery}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
